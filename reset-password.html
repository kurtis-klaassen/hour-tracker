<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - TradesClock</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --blue: #2196F3; --blue-dark: #1976D2; --dark: #1a1a2e; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, var(--dark) 0%, #16213e 50%, var(--blue-dark) 100%); }
    .box { background: #fff; border-radius: 16px; padding: 32px 28px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .logo { font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 700; text-align: center; color: var(--dark); margin-bottom: 4px; }
    .logo span { color: var(--blue); }
    h1 { font-family: 'Outfit', sans-serif; font-size: 1.3rem; text-align: center; color: #333; margin-bottom: 22px; }
    label { display: block; font-size: 0.9rem; color: #555; margin-bottom: 6px; }
    input { width: 100%; padding: 14px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; background: #f9f9f9; color: #333; margin-bottom: 16px; }
    button { width: 100%; padding: 14px; font-size: 1.05rem; font-weight: 600; color: #fff; background: var(--blue); border: none; border-radius: 8px; cursor: pointer; }
    button:disabled { background: #90CAF9; }
    .msg { margin-top: 16px; text-align: center; font-size: 0.95rem; line-height: 1.5; }
    .ok { color: #2e7d32; } .err { color: #c62828; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">⏱️ Trades<span>Clock</span></div>
    <h1>Choose a new password</h1>
    <form id="f">
      <label for="p1">New password</label>
      <input id="p1" type="password" minlength="6" required autocomplete="new-password">
      <label for="p2">Type it again</label>
      <input id="p2" type="password" minlength="6" required autocomplete="new-password">
      <button id="b" type="submit" disabled>Loading…</button>
    </form>
    <p id="m" class="msg"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    const sb = supabase.createClient(
      'https://jkxlfmrpvtqusfixdckl.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpreGxmbXJwdnRxdXNmaXhkY2tsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0NjQ3OTYsImV4cCI6MjA4NzA0MDc5Nn0.kL941TjFaS95w44qDWaeXHvUOF9aYHYJMGvGcylxtw8'
    );
    const b = document.getElementById('b'), m = document.getElementById('m');
    const show = (t, ok) => { m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'err'); };

    // Wait for Supabase to read the reset link
    setTimeout(async () => {
      const { data } = await sb.auth.getSession();
      if (data.session) { b.disabled = false; b.textContent = 'Save new password'; }
      else { b.textContent = 'Link expired'; show('This reset link is invalid or has expired. Open TradesClock and tap "Forgot password?" again.', false); }
    }, 800);

    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
      if (p1 !== p2) return show('The two passwords don\'t match.', false);
      if (p1.length < 6) return show('Password must be at least 6 characters.', false);
      b.disabled = true; b.textContent = 'Saving…';
      const { error } = await sb.auth.updateUser({ password: p1 });
      if (error) { b.disabled = false; b.textContent = 'Save new password'; return show(error.message, false); }
      await sb.auth.signOut();
      b.textContent = 'Done';
      show('Password changed! Go back to the TradesClock app and log in with your new password.', true);
    });
  </script>
</body>
</html>
